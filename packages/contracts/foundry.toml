[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
network = "monad"
hardfork = "monad:MonadNine"
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
